<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grouped bar Chart - Casualties by Hour of Day</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Casualties by Hour and Severity</h1>
        <p class="subtitle">Road Traffic Casualties - 2024</p>
        
        <div class="info-panel">
            <div class="info-card">
                <div class="label">Total Casualties</div>
                <div class="value" id="total-casualties">-</div>
            </div>
            <div class="info-card">
                <div class="label">Total Collisions</div>
                <div class="value" id="total-collisions">-</div>
            </div>
        </div>

        <div class="info-panel">
            <div class="info-card slight">
                <div class="label">Slight</div>
                <div class="value" id="slight-count">-</div>
            </div>
            <div class="info-card serious">
                <div class="label">Serious</div>
                <div class="value" id="serious-count">-</div>
            </div>
            <div class="info-card fatal">
                <div class="label">Fatal</div>
                <div class="value" id="fatal-count">-</div>
            </div>
        </div>

        

        <div class="legend">
            <div class="legend-item">
                <span class="legend-color" style="background: #3498db;"></span>
                <span>Slight</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #f39c12;"></span>
                <span>Serious</span>
            </div>
            <div class="legend-item">
                <span class="legend-color" style="background: #e74c3c;"></span>
                <span>Fatal</span>
            </div>
        </div>

        <div id="chart"></div>

        <footer>
            Data Source: UK Road Traffic Casualties 2024 | Visualization: D3.js v7
        </footer>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="hour"></div>
        <div class="severity"></div>
        <div class="count"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
