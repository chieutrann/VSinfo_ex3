<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bar Chart - Casualties by Weather Condition</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>Casualties by Weather Condition</h1>
        <p class="subtitle">Road Traffic Casualties - 2024</p>
        
        <div class="info-panel">
            <div class="info-card">
                <div class="label">Total Casualties</div>
                <div class="value" id="total-casualties">-</div>
            </div>
            <div class="info-card">
                <div class="label">Total Collisions</div>
                <div class="value" id="total-collisions">-</div>
            </div>
        </div>

        <div class="filter-section">
            <label class="filter-label">Select one or more casualty severity</label>
            <div class="filter-checkboxes">
                <label class="checkbox-item">
                    <input type="checkbox" id="select-all" checked>
                    <span>Select all</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" class="severity-filter" value="1" checked>
                    <span>Fatal</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" class="severity-filter" value="2" checked>
                    <span>Serious</span>
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" class="severity-filter" value="3" checked>
                    <span>Slight</span>
                </label>
            </div>
        </div>



        <div id="chart"></div>

        <footer>
            Data Source: UK Road Traffic Casualties 2024 | Visualization: D3.js v7
        </footer>
    </div>

    <div class="tooltip" id="tooltip">
        <div class="weather_cond"></div>
        <div class="severity"></div>
        <div class="count"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
